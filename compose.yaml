services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://pixelforever:pixelforever-local@postgres:5432/pixelforever
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pixelforever
      POSTGRES_USER: pixelforever
      POSTGRES_PASSWORD: pixelforever-local
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pixelforever", "-d", "pixelforever"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - accounts:/var/lib/postgresql/data

volumes:
  accounts:

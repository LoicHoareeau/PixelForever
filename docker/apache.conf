<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    ProxyPreserveHost On
    ProxyPass "/monde-socket" "ws://127.0.0.1:8081/monde-socket" retry=0 timeout=30

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript text/javascript application/json image/svg+xml
    </IfModule>

    <IfModule mod_expires.c>
        ExpiresActive On
    </IfModule>

    <IfModule mod_headers.c>
        <FilesMatch "\.(png|jpe?g|webp|svg|ico)$">
            Header set Cache-Control "public, max-age=604800, stale-while-revalidate=86400"
        </FilesMatch>
        <FilesMatch "^phaser-3\.90\.0\.min\.js$">
            Header set Cache-Control "public, max-age=604800, stale-while-revalidate=86400"
        </FilesMatch>
        <FilesMatch "\.(js|css)$">
            Header set Cache-Control "public, no-cache"
        </FilesMatch>
    </IfModule>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>

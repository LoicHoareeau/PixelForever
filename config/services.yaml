parameters:
    app.sqlite_url: 'sqlite:///%kernel.project_dir%/var/pixelforever.sqlite'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\Repository\:
        resource: '../src/Repository/'

    App\Game\GameAssets:
        arguments:
            $projectDir: '%kernel.project_dir%'
